name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run against the latest @workflow/world in the range, to catch
    # contract changes early.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint, typecheck, unit tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Enable corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Update @workflow/world to the latest in range (weekly run)
        if: github.event_name == 'schedule'
        run: pnpm update @workflow/world
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check package contents
        run: pnpm pack --dry-run

  # The whole integration suite (storage, queue, streams, S3 offload and
  # @workflow/world-testing at spec 8 and 9) against LocalStack, on every
  # run: unlike moto, LocalStack runs a TransactWriteItems in isolation, as
  # DynamoDB does. The community image needs no auth token; a
  # LOCALSTACK_AUTH_TOKEN secret, if the repository sets one, is passed on
  # (an unset secret is an empty string, which LocalStack ignores).
  integration-localstack:
    name: Integration tests (LocalStack)
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb,sqs,s3
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        options: >-
          --health-cmd "curl -fs http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      WORKFLOW_AWS_ENDPOINT: http://localhost:4566
      WORKFLOW_AWS_REGION: us-east-1
      # Never take LocalStack for moto: the storage suites then send their
      # DynamoDB requests concurrently, as against DynamoDB.
      WORKFLOW_AWS_EMULATOR: localstack
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Enable corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The global setup finds LocalStack already answering, so it does not
      # start moto_server. It sets dummy credentials itself.
      - run: pnpm test:integration

  # The same suite against moto_server, the alternative that needs no
  # image or token. Pinned to a major so a moto release cannot break CI
  # unrelated to a change.
  integration-moto:
    name: Integration tests (moto_server)
    runs-on: ubuntu-latest
    env:
      WORKFLOW_AWS_ENDPOINT: http://localhost:4566
      WORKFLOW_AWS_REGION: us-east-1
      WORKFLOW_AWS_EMULATOR: moto
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install moto_server
        run: pip install "moto[server]>=5,<6"
      - name: Enable corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Nothing answers at the endpoint, so the global setup starts
      # moto_server (on PATH after pip install) and stops it afterwards.
      - run: pnpm test:integration
