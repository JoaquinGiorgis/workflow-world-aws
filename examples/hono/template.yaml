# The Hono example on AWS, in Lambda mode, with @joaquingiorgis/world-aws:
#
# - one DynamoDB table (PK/SK, GSI1-GSI3, TTL on expiresAt, on demand);
# - the workflow and step SQS queues, each with a dead-letter queue after 73
#   receives and 14 days of retention;
# - an S3 bucket for payloads too large for DynamoDB or SQS;
# - the `api` function behind a function URL (starts and reads runs) and
#   the `queue` function behind both queues' event source mappings.
#
# Intrinsic functions are written in their long form (`Ref:`, `Fn::GetAtt:`)
# so the file is plain YAML (scripts/template.test.mjs reads it).
#
#   pnpm install && pnpm build   # .well-known/workflow/v1 for the bundle
#   sam build && sam deploy --guided
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Workflow SDK on AWS (Hono, Lambda mode, @joaquingiorgis/world-aws)

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 1024
    # The queues' visibility timeout is six times this (AWS's guidance for
    # SQS event sources), so a record is never handed to a second function
    # while the first one still runs it.
    Timeout: 60
    CodeUri: .
    Environment:
      Variables:
        WORKFLOW_TARGET_WORLD: "@joaquingiorgis/world-aws"
        WORKFLOW_AWS_REGION:
          Ref: AWS::Region
        WORKFLOW_AWS_TABLE:
          Ref: WorkflowTable
        WORKFLOW_AWS_WORKFLOW_QUEUE_URL:
          Ref: WorkflowQueue
        WORKFLOW_AWS_STEP_QUEUE_URL:
          Ref: StepQueue
        WORKFLOW_AWS_BUCKET:
          Ref: PayloadBucket
        NODE_OPTIONS: --enable-source-maps

Resources:
  WorkflowTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
        - { AttributeName: GSI3PK, AttributeType: S }
        - { AttributeName: GSI3SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        # Every run and every hook, by id.
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        # The runs of one workflow.
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        # Sparse: the runs that have not ended (startup recovery).
        - IndexName: GSI3
          KeySchema:
            - { AttributeName: GSI3PK, KeyType: HASH }
            - { AttributeName: GSI3SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  WorkflowDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  WorkflowQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 360
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt: [WorkflowDeadLetterQueue, Arn]
        maxReceiveCount: 73

  StepDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  StepQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 360
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt: [StepDeadLetterQueue, Arn]
        maxReceiveCount: 73

  PayloadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Bodies of queue messages that never reached a worker (dead
          # letters, abandoned sends); the queues keep messages 14 days.
          - Id: ExpireQueueBodies
            Status: Enabled
            Prefix: queue/
            ExpirationInDays: 15

  # docs/iam-policy.json, with the placeholders filled in.
  WorldPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WorkflowTableItems
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:ConditionCheckItem
            Resource:
              - Fn::GetAtt: [WorkflowTable, Arn]
          - Sid: WorkflowTableQueries
            Effect: Allow
            Action: [dynamodb:Query]
            Resource:
              - Fn::GetAtt: [WorkflowTable, Arn]
              - Fn::Sub: "${WorkflowTable.Arn}/index/*"
          - Sid: WorkflowQueues
            Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:ChangeMessageVisibility
            Resource:
              - Fn::GetAtt: [WorkflowQueue, Arn]
              - Fn::GetAtt: [StepQueue, Arn]
          - Sid: WorkflowPayloads
            Effect: Allow
            Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
            Resource:
              - Fn::Sub: "${PayloadBucket.Arn}/*"

  # Starts runs and reads them back. AWS_IAM: callers sign their requests;
  # the flow route is not served here, so nothing reaches the runtime's
  # delivery path from outside.
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda.api
      Policies:
        - Ref: WorldPolicy
      FunctionUrlConfig:
        AuthType: AWS_IAM
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: node22
        Platform: node
        Sourcemap: true
        EntryPoints: [src/lambda.ts]
        OutExtension: [.js=.mjs]
        Banner:
          - js=import { createRequire as bannerRequire } from 'node:module'; const require = bannerRequire(import.meta.url);

  # Runs the queue's deliveries. ReportBatchItemFailures is required: the
  # handler answers the records to keep, and without it Lambda would delete
  # failed ones too.
  QueueFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda.queue
      Policies:
        - Ref: WorldPolicy
      Events:
        WorkflowMessages:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt: [WorkflowQueue, Arn]
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
        StepMessages:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt: [StepQueue, Arn]
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        Target: node22
        Platform: node
        Sourcemap: true
        EntryPoints: [src/lambda.ts]
        OutExtension: [.js=.mjs]
        Banner:
          - js=import { createRequire as bannerRequire } from 'node:module'; const require = bannerRequire(import.meta.url);

Outputs:
  ApiUrl:
    Description: Function URL of the API (requests must be SigV4-signed)
    Value:
      Fn::GetAtt: [ApiFunctionUrl, FunctionUrl]
  WorkflowDeadLetterQueueUrl:
    Value:
      Ref: WorkflowDeadLetterQueue
  StepDeadLetterQueueUrl:
    Value:
      Ref: StepDeadLetterQueue
